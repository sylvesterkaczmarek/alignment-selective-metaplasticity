[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "alignment-selective-metaplasticity"
version = "0.3.1"
description = "Controlled experiments on alignment-selective metaplasticity under sequential capability updates."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Sylvester Kaczmarek"}]
dependencies = [
  "torch>=2.6,<3",
  "numpy>=2.0,<3",
  "PyYAML>=6.0,<7",
  "matplotlib>=3.9,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

openweights = ["transformers==4.57.6", "safetensors>=0.4.3,<1"]

[project.scripts]
asm-score = "alignment_metaplasticity.authority:main"

[tool.setuptools.package-data]
alignment_metaplasticity = ["fixtures/*.json", "fixtures/*.jsonl"]

[project.urls]
"Citation metadata" = "https://github.com/sylvesterkaczmarek/alignment-selective-metaplasticity/blob/main/CITATION.cff"
"Archived release" = "https://doi.org/10.5281/zenodo.24409485"
Homepage = "https://www.sylvesterkaczmarek.com"
Repository = "https://github.com/sylvesterkaczmarek/alignment-selective-metaplasticity"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff.lint]
select = ["F"]
