name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev]"
          python -m pip check
      - name: Tests
        run: pytest -q
      - name: Smoke experiment
        if: matrix.python-version == '3.11'
        run: python -m experiments.run_all --seeds 73 --out /tmp/alignment-selective-metaplasticity-smoke

  package:
    name: Build and verify installed package
    needs: test
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Build and validate distributions
        run: |
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Install wheel and test dependencies
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install dist/*.whl 'pytest>=8,<10'
          python -m pip check
      - name: Verify installed source matches checkout
        run: |
          python - <<'PY'
          from pathlib import Path
          import alignment_metaplasticity
          installed = Path(alignment_metaplasticity.__file__).resolve().parent
          source = Path('src/alignment_metaplasticity').resolve()
          assert installed != source
          for module in source.glob('*.py'):
              assert module.read_bytes() == (installed / module.name).read_bytes(), module
          PY
      - name: Test installed wheel
        run: python -m pytest -q
